name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options: [release, debug]
  push:
    branches: [ main, spanish-translation, traduccion-al-espanol ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Determine build mode
        id: mode
        run: |
          mode="${{ github.event.inputs.build_type }}"
          if [ -z "$mode" ]; then mode="release"; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Build APK (per-ABI, arm64/arm32/x64)
        run: flutter build apk --${{ steps.mode.outputs.mode }} --split-per-abi

      - name: List build outputs
        if: always()
        run: find build -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-apks-${{ steps.mode.outputs.mode }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
